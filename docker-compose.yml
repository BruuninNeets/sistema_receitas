services:
  web:
    build: .
    ports:
      - "${APP_PORT}:80"
    dns:                 
      - 8.8.8.8           
      - 8.8.4.4
    volumes:
      - .:/var/www/html/
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_PORT=${SMTP_PORT}
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "${DB_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
  
  flyway:
    image: flyway/flyway:latest
    container_name: sistema_receitas_${APP_ENV:-homolog}-flyway
    volumes:
      - ./db/migration:/flyway/sql
    environment:
      - FLYWAY_URL=jdbc:mysql://db:3306/sistema_receitas 
      - FLYWAY_USER=root
      - FLYWAY_PASSWORD=FsT#8723S
    depends_on:
      - db
    command: migrate

  sonarqube:
    image: sonarqube:community
    profiles: ["qa"] 
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

volumes:
  db_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions: